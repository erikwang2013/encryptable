<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="spTitle spDesc"
     font-family="'Source Han Sans CN','Noto Sans SC','Segoe UI','Microsoft YaHei',sans-serif">
  <title id="spTitle">Encryptable — query-friendly encryption for PHP</title>
  <desc id="spDesc">GitHub social preview: Locky the padlock pet beside the Encryptable title, tagline, and supported frameworks.</desc>

  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#spBg)"/>

  <!-- ambient decoration -->
  <g fill="none" stroke="#C7D2FE">
    <circle cx="1010" cy="320" r="252" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="1010" cy="320" r="312" stroke-opacity="0.06" stroke-width="2"/>
  </g>
  <g fill="#C7D2FE" opacity="0.4">
    <circle cx="120" cy="96" r="3"/>
    <circle cx="420" cy="560" r="2.5"/>
    <circle cx="1226" cy="128" r="3.5"/>
    <circle cx="1168" cy="556" r="2.5"/>
    <circle cx="690" cy="86" r="2"/>
  </g>
  <circle cx="1010" cy="320" r="330" fill="url(#spGlow)"/>

  <!-- left: identity -->
  <g>
    <rect x="96" y="112" width="308" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.10" stroke="#C7D2FE" stroke-opacity="0.28"/>
    <text x="118" y="140" font-size="18" fill="#C7D2FE" letter-spacing="0.5">erikwang2013/encryptable</text>

    <text x="92" y="272" font-size="94" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Encryptable</text>

    <text x="96" y="334" font-size="30" fill="#E0E7FF">Query-friendly encryption for PHP 8.0+</text>

    <text x="96" y="382" font-size="19" fill="#A5B4FC">AES-256-GCM · deterministic ciphertext · zero-downtime key rotation</text>

    <text x="96" y="466" font-size="20" font-weight="600" fill="#C7D2FE">Laravel · Hyperf · ThinkPHP · Webman · Native PHP</text>
    <rect x="96" y="488" width="64" height="3" rx="1.5" fill="#F59E0B"/>
  </g>

  <!-- right: Locky -->
  <svg x="701" y="110" width="507" height="420" viewBox="0 40 320 265" overflow="hidden">
    <defs>
      <linearGradient id="petBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset="1" stop-color="#DBE2FF"/>
      </linearGradient>
      <linearGradient id="petKeyGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FDE68A"/>
        <stop offset="1" stop-color="#F59E0B"/>
      </linearGradient>
    </defs>
    <g transform="translate(0,-10)">
      <!-- feet -->
      <ellipse cx="128" cy="282" rx="23" ry="12" fill="#C7D2FE" stroke="#1E1B4B" stroke-width="4"/>
      <ellipse cx="192" cy="282" rx="23" ry="12" fill="#C7D2FE" stroke="#1E1B4B" stroke-width="4"/>

      <!-- shackle -->
      <path d="M104 158 A56 56 0 0 1 216 158" fill="none" stroke="#1E1B4B" stroke-width="18" stroke-linecap="round"/>

      <!-- key ring -->
      <g transform="rotate(-30 160 94)">
        <circle cx="160" cy="101" r="9" fill="#94A3B8" stroke="#1E1B4B" stroke-width="3"/>
        <rect x="157.5" y="105" width="5" height="30" rx="2.5" fill="#94A3B8" stroke="#1E1B4B" stroke-width="3"/>
        <rect x="162.5" y="119" width="8" height="5" rx="2" fill="#94A3B8"/>
        <rect x="162.5" y="127" width="6" height="5" rx="2" fill="#94A3B8"/>
      </g>
      <g transform="rotate(30 160 94)">
        <circle cx="160" cy="101" r="9" fill="#94A3B8" stroke="#1E1B4B" stroke-width="3"/>
        <rect x="157.5" y="105" width="5" height="30" rx="2.5" fill="#94A3B8" stroke="#1E1B4B" stroke-width="3"/>
        <rect x="162.5" y="119" width="8" height="5" rx="2" fill="#94A3B8"/>
        <rect x="162.5" y="127" width="6" height="5" rx="2" fill="#94A3B8"/>
      </g>
      <g>
        <circle cx="160" cy="101" r="9.5" fill="url(#petKeyGold)" stroke="#1E1B4B" stroke-width="3"/>
        <rect x="157.5" y="105" width="5" height="32" rx="2.5" fill="url(#petKeyGold)" stroke="#1E1B4B" stroke-width="3"/>
        <rect x="162.5" y="127" width="9" height="5.5" rx="2" fill="#F59E0B"/>
        <rect x="162.5" y="136" width="6.5" height="5.5" rx="2" fill="#F59E0B"/>
      </g>

      <!-- body -->
      <rect x="80" y="146" width="160" height="128" rx="34" fill="url(#petBody)" stroke="#1E1B4B" stroke-width="4"/>

      <!-- arms -->
      <rect x="62" y="198" width="26" height="54" rx="13" fill="#E8EDFF" stroke="#1E1B4B" stroke-width="4"/>
      <rect x="232" y="198" width="26" height="54" rx="13" fill="#E8EDFF" stroke="#1E1B4B" stroke-width="4"/>
      <circle cx="75" cy="258" r="14" fill="#E8EDFF" stroke="#1E1B4B" stroke-width="4"/>
      <circle cx="245" cy="258" r="14" fill="#E8EDFF" stroke="#1E1B4B" stroke-width="4"/>

      <!-- AEAD badge -->
      <path d="M100 240 h26 v12 c0 10 -13 16 -13 16 s-13 -6 -13 -16 z" fill="#10B981" stroke="#1E1B4B" stroke-width="3"/>
      <path d="M107 251 l4.5 4.5 l9.5 -9.5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- face -->
      <ellipse cx="132" cy="194" rx="10" ry="13" fill="#1E1B4B"/>
      <ellipse cx="188" cy="194" rx="10" ry="13" fill="#1E1B4B"/>
      <circle cx="135.5" cy="189" r="3.2" fill="#FFFFFF"/>
      <circle cx="184.5" cy="189" r="3.2" fill="#FFFFFF"/>
      <ellipse cx="104" cy="214" rx="11" ry="6" fill="#FB7185" opacity="0.45"/>
      <ellipse cx="216" cy="214" rx="11" ry="6" fill="#FB7185" opacity="0.45"/>
      <circle cx="160" cy="214" r="10.5" fill="#1E1B4B"/>
      <path d="M153.5 220 h13 l4 15 h-21 z" fill="#1E1B4B"/>
    </g>
  </svg>
</svg>
